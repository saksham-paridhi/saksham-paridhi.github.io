<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saksham & Paridhi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&text=%26&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Italiana&family=Great+Vibes&display=swap">
<style>
/* Paged wedding invitation: one full-bleed illustrated scene at a time inside a phone-shaped column.
   Single deliberate look (watercolour pastel paper), so colours are set explicitly rather than themed. */
:root{
  --ink:#5a4335;        /* warm umber text */
  --ink-soft:#7d6656;
  --rose:#a8436a;       /* script titles and names */
  --blush:#f7ddd6;
  --peach:#fbe6d4;
  --sage:#c9d9bd;
  --gold:#c49a4b;
  --cream:#fbf6ee;
  --chip:rgba(58,52,40,.72);
  --f-display:"Italiana","Cormorant Garamond",Georgia,serif;
  --f-body:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-script:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;
  color-scheme:light;
}
html,body{height:100%;}
*{font-variant-numeric:lining-nums!important;}
body{margin:0;background:#e9e1d6;color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px));}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;}
.backdrop{position:absolute;inset:-40px;background:var(--bd, linear-gradient(#f3e3dc,#e7dccb));filter:blur(30px) saturate(1.05);transform:scale(1.1);transition:background .8s;}
.backdrop::after{content:"";position:absolute;inset:0;background:rgba(40,30,20,.18);}
.device{position:relative;width:100%;height:100%;overflow:hidden;background:var(--cream);isolation:isolate;}
.stage.is-desk .device{border-radius:34px;box-shadow:0 30px 80px rgba(40,25,15,.35),0 0 0 1px rgba(255,255,255,.35) inset;}
.paper{position:absolute;inset:0;pointer-events:none;z-index:40;mix-blend-mode:multiply;opacity:.55;background-size:220px 220px;}

/* scenes */
.scene{position:absolute;inset:0;visibility:hidden;z-index:1;}
.scene.on{visibility:visible;}
.scene.live{z-index:3;}
.scene .bg{position:absolute;inset:0;}
.cam{position:absolute;inset:0;transform-origin:50% 50%;}
.frame{position:absolute;left:0;top:0;width:1080px;height:2400px;transform-origin:0 0;}
.lay{position:absolute;display:block;}
.hit{position:absolute;cursor:pointer;z-index:6;}
.lays{position:absolute;inset:0;}
.scene:not(.live) *{animation-play-state:paused!important;}

/* text, in design px (the frame is scaled to the device) */
.txt{position:absolute;left:0;width:1080px;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;z-index:5;}
.txt .ln{opacity:0;transform:translateY(26px);filter:blur(6px);}
.scene.reveal .txt .ln{animation:lnIn 1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*110ms + 200ms);}
.scene.reveal .txt .ln.write{animation:lnWrite 1.6s ease forwards;animation-delay:calc(var(--i,0)*110ms + 200ms);}
@keyframes lnIn{to{opacity:1;transform:none;filter:none;}}
@keyframes lnWrite{0%{opacity:1;filter:none;transform:none;clip-path:inset(-20% 100% -20% 0);}100%{opacity:1;filter:none;transform:none;clip-path:inset(-20% -5% -20% 0);}}
.day{font:600 104px/1 var(--f-body);color:var(--ink);font-variant-numeric:lining-nums;}
.day sup{font-size:.46em;vertical-align:0;position:relative;top:-.95em;margin-left:2px;}
.month{font:600 44px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin-top:14px;font-variant-numeric:lining-nums;}
.tbd{font:500 40px/1.2 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);padding:16px 40px;border-top:2px solid rgba(196,154,75,.55);border-bottom:2px solid rgba(196,154,75,.55);}
.script{font:400 132px/1.2 var(--f-script);color:var(--rose);margin-top:18px;padding:0 30px;white-space:nowrap;}
.time{font:600 54px/1.2 var(--f-body);color:var(--ink);margin-top:6px;}
.note{font:500 italic 42px/1.2 var(--f-body);color:var(--rose);}
.vlabel{font:500 40px/1.2 var(--f-body);color:var(--ink-soft);margin-top:28px;letter-spacing:.06em;}
.venue{font:600 56px/1.18 var(--f-body);color:var(--ink);}
.venue small{display:block;font:500 44px/1.25 var(--f-body);color:var(--ink-soft);}
.duo{display:flex;gap:56px;margin-top:30px;justify-content:center;}
.duo>div{display:flex;flex-direction:column;align-items:center;max-width:430px;}
.duo .who{font:600 40px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--rose);margin-bottom:8px;}
.duo .venue{font-size:50px;}
.duo .venue small{font-size:40px;}
.intro{font:500 46px/1.36 var(--f-body);color:var(--ink);max-width:820px;}
.nm{font:400 96px/1.05 var(--f-display);color:var(--rose);margin-top:22px;letter-spacing:.02em;}
.nm-with{font:400 48px/1 var(--f-display);color:var(--rose);margin:26px 0 0;text-transform:uppercase;letter-spacing:.12em;}
.par{font:600 39px/1.4 var(--f-body);color:var(--ink);margin-top:14px;max-width:980px;}
.onDrape.nglow{position:relative;background:none;padding:20px 24px 30px;}
.nglow .par{max-width:none;font-size:38px;white-space:nowrap;}
.nglow .intro{font-size:43px;max-width:800px;}
.onDrape.nglow::before{content:"";position:absolute;inset:-70px -40px -60px;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(253,249,242,.86),rgba(253,249,242,.7) 55%,rgba(253,249,242,.32) 82%,rgba(253,249,242,0));}
.orn{width:420px;height:70px;}
.capsr{font:600 46px/1.2 var(--f-display);color:var(--rose);letter-spacing:.1em;text-transform:uppercase;margin-top:34px;}
.rows{font:500 38px/1.38 var(--f-body);color:var(--ink);}
.rows .ph{color:var(--ink-soft);opacity:.55;font-style:italic;}
.msg{font:500 54px/1.3 var(--f-body);color:var(--ink);max-width:790px;}
.cv-names{font:400 92px/1.05 var(--f-display);color:var(--ink);letter-spacing:.03em;white-space:nowrap;}
.cv-names .amp{font-family:"Playfair Display",Georgia,serif;font-weight:400;color:var(--rose);font-size:.78em;padding:0 .3em;}
.pf{font-family:"Playfair Display",Georgia,serif;font-style:normal;font-weight:400;font-size:.94em;}
.chips{position:relative;display:flex;align-items:center;gap:28px;margin-top:30px;padding:22px 44px;border:3px solid rgba(181,72,109,.55);border-radius:26px;background:rgba(255,250,246,.55);}
.chips .d{display:flex;flex-direction:column;align-items:center;font:600 64px/1 var(--f-body);color:var(--rose);font-variant-numeric:lining-nums;}
.chips .d i{font-style:normal;white-space:nowrap;}.chips .d sup{font-size:.42em;position:relative;top:-.95em;vertical-align:0;margin-left:3px;}
.chips .d span{font:600 30px/1.2 var(--f-body);letter-spacing:.16em;text-transform:uppercase;margin-top:6px;}
.chips .amp2{font:400 58px/1 "Playfair Display",Georgia,serif;color:var(--ink);}
.chips .soon{display:flex;flex-direction:column;align-items:center;font:600 46px/1.2 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--rose);white-space:nowrap;}
.chips .soon span{font:500 italic 36px/1.3 var(--f-body);letter-spacing:.04em;text-transform:none;color:var(--ink-soft);margin-top:6px;}
.count{display:flex;gap:22px;margin-top:26px;}
.count div{min-width:120px;padding:14px 10px;border-radius:20px;background:rgba(255,255,255,.55);font:600 58px/1 var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums lining-nums;}
.count div span{display:block;font:600 24px/1.4 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);}
.mono{width:150px;height:150px;}

/* tap hint */
.hint{position:absolute;width:0;height:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .6s;}
.hint.on{opacity:1;}
.hint .ring{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:5px solid rgba(255,255,255,.95);box-shadow:0 0 30px rgba(255,255,255,.6);animation:ring 2s ease-out infinite;}
.hint .ring.b{animation-delay:1s;}
@keyframes chipGlow{0%,100%{box-shadow:0 6px 20px rgba(60,30,20,.18),0 0 0 0 rgba(255,255,255,.5)}50%{box-shadow:0 6px 20px rgba(60,30,20,.18),0 0 0 10px rgba(255,255,255,0)}}
.hint .chip{animation:chipGlow 2.2s ease-in-out infinite;}
.hint .core{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 0 24px 6px rgba(255,255,255,.8);animation:core 2s ease-in-out infinite;}
@keyframes ring{0%{transform:scale(.35);opacity:0}25%{opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes core{50%{transform:scale(.8)}}
.chip{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;padding:18px 40px;border-radius:999px;background:var(--chip);color:#fff8ef;font:600 32px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;box-shadow:0 8px 24px rgba(40,30,20,.25);border:1.5px solid rgba(255,255,255,.35);}

.hint .chip{background:rgba(255,250,244,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#5a2c22;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(60,30,20,.18);font-size:36px;font-weight:700;padding:20px 44px;letter-spacing:.16em;}
.hint .ring{border-color:#fff;box-shadow:0 0 24px rgba(255,255,255,.8);}
.hint .fill{position:absolute;left:-70px;top:-70px;width:140px;height:140px;}

/* nav chrome (screen px) */
.nav{position:absolute;inset:0;z-index:30;pointer-events:none;}
.nbtn{pointer-events:auto;position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;color:#5b5440;transition:opacity .4s,transform .2s;padding:0;}
.nbtn:hover{transform:scale(1.06);}
.nbtn:focus-visible,.dot:focus-visible,.gbtn:focus-visible,.replay:focus-visible{outline:2px solid var(--rose);outline-offset:3px;}
.nbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.n-back{left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));}
.n-mute{right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));}
.n-next{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));}
.n-mute .off{display:none}.n-mute.muted .off{display:block}.n-mute.muted .on{display:none}
.nbtn[hidden]{display:none!important}
.dots{pointer-events:auto;position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:6px 10px;border-radius:999px;}
.dot{width:20px;height:20px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;}
.dot i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(80,70,50,.18);transition:all .35s;}
.dot[data-s=locked]{cursor:default}.dot[data-s=locked] i{opacity:.45;transform:scale(.75)}
.dot[data-s=cur] i{width:18px;border-radius:5px;background:var(--gold);}

/* curtain */
.curtain{position:absolute;inset:0;z-index:50;cursor:pointer;background:transparent;}
.curtain .half{position:absolute;top:0;bottom:0;width:51%;}
.curtain .l{left:0}.curtain .r{right:0}
.curtain svg{width:100%;height:100%;display:block;}
.curtain .chipS{position:absolute;left:50%;bottom:calc(17% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:14px 28px;border-radius:999px;background:rgba(255,250,244,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#5a2c22;font:700 13px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(60,30,20,.18);}
.curtain .ringS{position:absolute;left:50%;bottom:calc(25% + env(safe-area-inset-bottom,0px));width:0;height:0;}
.curtain .ringS .ring{left:-22px;top:-22px;width:44px;height:44px;border-width:2px;}
.curtain .ringS .core{left:-7px;top:-7px;width:14px;height:14px;}
.curtain .names{position:absolute;left:0;right:0;top:34%;text-align:center;color:#8a5a52;font:400 15px/1.4 var(--f-body);letter-spacing:.35em;text-transform:uppercase;opacity:.8;}
.curtain .names b{display:block;font:400 34px/1.2 var(--f-display);letter-spacing:.04em;text-transform:none;margin-top:6px;color:#7c4250;}
#opStage{position:absolute;inset:0;overflow:hidden;}
.curtain .names,.curtain .chipS,.curtain .ringS{z-index:6;}
.oppick{z-index:7;}
.oprep{pointer-events:auto;position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(58,44,40,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff8ef;font:600 12px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;}
.oprep[hidden]{display:none!important;}
/* floral doors */
.curtain[data-style=doors] .names{top:31%;color:#7a5a3c;}
.curtain[data-style=doors] .names b{color:#7a3e4e;}
.door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#eadcc8,#fbf4ea 35%,#f6ecdf 70%,#e8d8c2);box-shadow:inset 0 0 0 9px #f9f1e6,inset 0 0 0 12px #c9a35a,inset 0 0 50px rgba(150,110,60,.18);backface-visibility:hidden;}
.door.dl{left:0;transform-origin:0 50%;}.door.dr{right:0;transform-origin:100% 50%;}
.dpanel{position:absolute;left:16%;right:16%;top:13%;height:44%;border:3px solid #c9a35a;border-radius:999px 999px 10px 10px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.85),rgba(255,255,255,0) 60%),repeating-radial-gradient(circle at 50% 0,rgba(201,163,90,.16) 0 2px,transparent 2px 14px);box-shadow:inset 0 0 0 7px #fbf5ec,inset 0 0 0 9px rgba(201,163,90,.55);}
.dpanel2{position:absolute;left:16%;right:16%;top:62%;bottom:8%;border:3px solid #c9a35a;border-radius:10px;background:repeating-linear-gradient(45deg,rgba(201,163,90,.12) 0 2px,transparent 2px 12px);box-shadow:inset 0 0 0 7px #fbf5ec,inset 0 0 0 9px rgba(201,163,90,.55);}
.dknob{position:absolute;top:57%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#c9973e 60%,#8a6224);box-shadow:0 2px 4px rgba(0,0,0,.25);}
.dl .dknob{right:7%;}.dr .dknob{left:7%;}
.dflora{position:absolute;top:-1%;width:64%;pointer-events:none;}
.dl .dflora{left:-6%;}.dr .dflora{right:-6%;}
.dseam{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff4d6;box-shadow:0 0 18px 6px rgba(255,214,140,.7);opacity:.5;z-index:3;}
.dglow{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 55%,rgba(255,238,196,.95),rgba(255,226,170,0));opacity:0;}
.dwire,.dbulbs{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;}
.dbulbs .fairy{opacity:1;}
/* envelope */
.curtain[data-style=envelope] .names{top:15%;}
.ebg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,#fdf3ee,#f3d8d0 60%,#e6bfb7);}
.ebg::after{content:"";position:absolute;inset:0;opacity:.6;background:radial-gradient(circle,transparent 0 26px,rgba(201,163,90,.14) 27px 28px,transparent 29px) 0 0/80px 80px;}
.env{position:absolute;left:9%;width:82%;aspect-ratio:1.42;top:54%;margin-top:-28.87%;}
.eback{position:absolute;inset:0;border-radius:10px;background:linear-gradient(#e6cdbb,#d7baa4);z-index:1;}
.efront{position:absolute;inset:0;z-index:3;border-radius:10px;background:linear-gradient(160deg,#fcf5ec,#f0e0d0);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);}
.efront::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.6%,rgba(170,130,100,.3) 50%,transparent 50.4%) 0 0/50% 100% no-repeat,linear-gradient(to top left,transparent 49.6%,rgba(170,130,100,.3) 50%,transparent 50.4%) 100% 0/50% 100% no-repeat;}
.efront::after{content:"";position:absolute;left:4%;right:4%;bottom:7%;height:2px;background:linear-gradient(90deg,transparent,#c9a35a,transparent);}
.eflap{position:absolute;left:0;right:0;top:0;height:62%;z-index:4;background:linear-gradient(#f8eee3,#ead7c4);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;}
.eseal{position:absolute;left:50%;top:62%;width:120px;height:120px;margin:-60px 0 0 -60px;z-index:5;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c9476e,#9b2a4f 60%,#741b38);box-shadow:0 5px 12px rgba(80,20,40,.4),inset 0 0 0 6px rgba(255,255,255,.08);display:grid;place-items:center;}
.efill{position:absolute;z-index:2;filter:drop-shadow(0 8px 14px rgba(80,40,30,.28));pointer-events:none;}
.efill img{display:block;width:100%;height:100%;}
.efill .eblank{display:block;width:100%;height:100%;background:linear-gradient(180deg,#e2f1fb 0%,#eef6f9 30%,#f9f6ef 55%,#fcf3e8 78%,#f9ece2 100%);}
/* monogram */
.curtain[data-style=monogram] .names{top:61%;}
.mbg{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 45%,#fffaf4,#f8e3dc 60%,#eecbc4);}
.mbg::after{content:"";position:absolute;inset:0;opacity:.55;background:radial-gradient(circle,transparent 0 30px,rgba(201,163,90,.13) 31px 32px,transparent 33px) 0 0/90px 90px;}
.opmono{position:absolute;left:50%;top:42%;width:260px;height:260px;margin:-130px 0 0 -130px;overflow:hidden;border-radius:50%;}
.msheen{position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:translateX(-200%);}
.mpetals{position:absolute;inset:0;pointer-events:none;}
.mp{position:absolute;left:50%;top:42%;width:22px;height:15px;margin:-7px 0 0 -11px;border-radius:60% 40% 60% 40%;}
.curtain:not(.ready) .chipS::after{content:" ·";animation:tw 1s infinite alternate}

/* fx */
.fx{position:absolute;inset:0;z-index:35;pointer-events:none;}
.hpop{position:absolute;border-radius:50%;background:radial-gradient(circle,#ffd23a 0%,#f6a21c 55%,rgba(240,140,20,0) 72%);pointer-events:none;z-index:40;}
.hwash{position:absolute;border-radius:50%;pointer-events:none;opacity:0;z-index:45;}
.wash{position:absolute;inset:0;z-index:36;pointer-events:none;opacity:0;}

/* map scene UI (design px) */
.mapui{position:absolute;left:0;width:1080px;display:flex;flex-direction:column;align-items:center;gap:64px;z-index:6;}
.vcard{position:relative;width:980px;padding:10px 20px 14px;text-align:center;--ink:#34190f;--ink-soft:#4e2a1e;}
.vcard::before{content:"";position:absolute;inset:-40px -30px;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(255,249,242,.78),rgba(255,247,240,.55) 60%,rgba(255,247,240,0));}
.vcard .ln,.vcard>div{text-shadow:0 0 3px #fffaf3,0 0 10px rgba(255,250,243,.95),0 0 22px rgba(255,250,243,.8);}
.vcard .vev{font:700 40px/1.2 var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:#8e3550;}
.vcard .vname{font:600 72px/1.1 var(--f-body);color:var(--ink);margin-top:6px;}
.vcard .vaddr{font:600 42px/1.3 var(--f-body);color:var(--ink-soft);margin-top:4px;}
.vcard .vwhen{font:600 italic 42px/1.3 var(--f-body);color:var(--ink);margin-top:6px;}
.vwhen.scr{position:relative;display:inline-block;-webkit-user-select:none;user-select:none;margin:14px auto 0;padding:16px 34px;min-width:560px;box-sizing:border-box;}
.scr-c{position:absolute;inset:-3px;width:calc(100% + 6px);height:calc(100% + 6px);border-radius:26px;pointer-events:auto;touch-action:none;cursor:grab;box-shadow:0 4px 14px rgba(120,80,20,.25);}
.gbtn{display:inline-flex;align-items:center;gap:14px;margin-top:20px;padding:18px 44px;border-radius:999px;background:var(--rose);color:#fff8f3;font:600 30px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;box-shadow:0 10px 26px rgba(140,40,80,.28);}
.gbtn svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2.2;}

/* ---------- flora ---------- */
const EDGE={pk:"#c76a86",bl:"#d793a5",pc:"#d9835d",wh:"#cdb4ad",co:"#b84866",mg:"#a72e78",li:"#9476bd",yl:"#d48a06",or:"#c24e08",bu:"#7a9cc0"};
function leaf(x,y,len,ang,g,w){ g=g||"leafA"; w=w==null?.36:w;
  return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(ang)})"><path d="M0 0 C${f1(len*w)} ${f1(-len*.25)} ${f1(len*w*.8)} ${f1(-len*.75)} 0 ${f1(-len)} C${f1(-len*w*.8)} ${f1(-len*.75)} ${f1(-len*w)} ${f1(-len*.25)} 0 0Z" fill="url(#${g})"/><path d="M0 0 Q${f1(len*.04)} ${f1(-len*.5)} 0 ${f1(-len*.92)}" stroke="#2e4f2b" stroke-opacity=".28" stroke-width="${f1(Math.max(1,len*.03))}" fill="none"/></g>`; }
function rose(x,y,r,t,rot){ t=t||"pk"; const e=EDGE[t]; rot=rot||0; let s=`<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)})">`;
  for(let i=0;i<6;i++){ const a=i*60+15; const ar=a*Math.PI/180; s+=`<ellipse cx="${f1(Math.cos(ar)*r*.45)}" cy="${f1(Math.sin(ar)*r*.45)}" rx="${f1(r*.58)}" ry="${f1(r*.44)}" transform="rotate(${a} ${f1(Math.cos(ar)*r*.45)} ${f1(Math.sin(ar)*r*.45)})" fill="url(#${t})" stroke="${e}" stroke-opacity=".45" stroke-width="${f1(Math.max(.8,r*.04))}"/>`; }
  s+=`<circle r="${f1(r*.62)}" fill="url(#${t})"/>`;
  s+=`<path d="M${f1(-r*.5)} ${f1(r*.08)} Q0 ${f1(r*.62)} ${f1(r*.5)} ${f1(r*.08)}" fill="none" stroke="${e}" stroke-opacity=".6" stroke-width="${f1(Math.max(1,r*.06))}"/>`;
  s+=`<path d="M${f1(-r*.3)} ${f1(-r*.02)} A${f1(r*.3)} ${f1(r*.28)} 0 1 1 ${f1(r*.2)} ${f1(r*.2)} M${f1(-r*.1)} ${f1(-r*.1)} A${f1(r*.13)} ${f1(r*.12)} 0 1 1 ${f1(r*.08)} ${f1(r*.06)}" fill="none" stroke="${e}" stroke-opacity=".7" stroke-width="${f1(Math.max(1,r*.07))}" stroke-linecap="round"/>`;
  return s+`</g>`; }
function marigold(x,y,r,t,seed){ t=t||"or"; const R=rng(seed||((x*7+y)|0)); const e=EDGE[t]; const star=(rr,n)=>{ let d=""; for(let i=0;i<n*2;i++){ const a=i*Math.PI/n; const q=i%2? rr*.74 : rr*(.86+R()*.14); d+=(i?"L":"M")+f1(Math.cos(a)*q)+" "+f1(Math.sin(a)*q); } return d+"Z"; };
  return `<g transform="translate(${f1(x)} ${f1(y)})"><path d="${star(r,20)}" fill="url(#${t})" stroke="${e}" stroke-opacity=".4" stroke-width="${f1(Math.max(.8,r*.05))}"/><path d="${star(r*.68,16)}" fill="url(#${t})" stroke="${e}" stroke-opacity=".45" stroke-width="${f1(Math.max(.8,r*.05))}"/><circle r="${f1(r*.26)}" fill="${e}" opacity=".45"/></g>`; }
function blossom(x,y,r,t,rot){ t=t||"bl"; const e=EDGE[t]; let s=`<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot||0)})">`;
  for(let i=0;i<5;i++){ const a=i*72; s+=`<ellipse cx="0" cy="${f1(-r*.5)}" rx="${f1(r*.36)}" ry="${f1(r*.52)}" transform="rotate(${a})" fill="url(#${t})" stroke="${e}" stroke-opacity=".4" stroke-width="${f1(Math.max(.6,r*.04))}"/>`; }
  return s+`<circle r="${f1(r*.18)}" fill="#e8b34a"/>${[0,1,2,3,4].map(i=>`<circle cx="${f1(Math.cos(i*1.256)*r*.26)}" cy="${f1(Math.sin(i*1.256)*r*.26)}" r="${f1(r*.05)}" fill="#c98a2a"/>`).join("")}</g>`; }
function hydrangea(x,y,r,t,seed){ t=t||"li"; const R=rng(seed||7); let s=`<g transform="translate(${f1(x)} ${f1(y)})"><circle r="${f1(r)}" fill="url(#${t})" opacity=".5"/>`;
  for(let i=0;i<14;i++){ const a=R()*Math.PI*2, d=Math.sqrt(R())*r*.78, fr=r*(.2+R()*.08); const cx=Math.cos(a)*d, cy=Math.sin(a)*d; s+=`<g transform="translate(${f1(cx)} ${f1(cy)}) rotate(${f1(R()*90)})">`;
    for(let k=0;k<4;k++) s+=`<ellipse cx="0" cy="${f1(-fr*.45)}" rx="${f1(fr*.38)}" ry="${f1(fr*.48)}" transform="rotate(${k*90})" fill="url(#${t})" stroke="${EDGE[t]}" stroke-opacity=".35" stroke-width="1"/>`;
    s+=`<circle r="${f1(fr*.12)}" fill="${EDGE[t]}"/></g>`; }
  return s+"</g>"; }
function bract(x,y,r,rot){ /* bougainvillea: three papery bracts */ let s=`<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)})">`;
  for(let i=0;i<3;i++) s+=`<path d="M0 0 C${f1(r*.55)} ${f1(-r*.3)} ${f1(r*.45)} ${f1(-r*.9)} 0 ${f1(-r)} C${f1(-r*.45)} ${f1(-r*.9)} ${f1(-r*.55)} ${f1(-r*.3)} 0 0Z" transform="rotate(${i*120})" fill="url(#mg)" stroke="#a72e78" stroke-opacity=".35" stroke-width="1.2"/>`;
  return s+`<circle r="${f1(r*.12)}" fill="#fff4d6"/></g>`; }
function dots(x,y,w,h,n,seed,c){ const R=rng(seed); let s=""; for(let i=0;i<n;i++) s+=`<circle cx="${f1(x+(R()-.5)*w)}" cy="${f1(y+(R()-.5)*h)}" r="${f1(2+R()*3)}" fill="${c||"#fffaf4"}"/>`; return s; }

const PAL={ rose:["pk","bl","wh","co"], peach:["pc","bl","wh","yl"], wedding:["pk","wh","bl","co"], marigold:["or","yl"], lilac:["li","bl","wh"], mixed:["pk","pc","wh","li","bl"] };
function bush(x,y,w,h,seed,opt){ opt=opt||{}; const R=rng(seed); const pal=PAL[opt.pal||"mixed"]; let s=`<g transform="translate(${f1(x)} ${f1(y)})">`;
  const n=opt.leaves||Math.round(w*h/900);
  const pt=()=>{ const a=R()*Math.PI, d=Math.sqrt(R()); return [Math.cos(a)*d*w*.5*(R()>.5?1:-1), -Math.sin(a)*d*h*.95]; };
  for(let i=0;i<n*.5;i++){ const [px,py]=pt(); s+=leaf(px,py,h*(.18+R()*.12),R()*360,"leafC"); }
  for(let i=0;i<n*.5;i++){ const [px,py]=pt(); s+=leaf(px,py,h*(.16+R()*.12),R()*360,R()>.4?"leafA":"leafB"); }
  const fl=opt.flowers==null?Math.round(w/40):opt.flowers;
  for(let i=0;i<fl;i++){ const [px,py]=pt(); const t=pal[Math.floor(R()*pal.length)]; const r=h*(.06+R()*.05)*(opt.fs||1);
    const kind=opt.kind||(t==="li"?"h":"r"); s+= (t==="or"||t==="yl")? marigold(px,py,r,t,seed+i) : kind==="h"? hydrangea(px,py,r*1.4,t,seed+i) : R()>.25? rose(px,py,r,t,R()*360) : blossom(px,py,r,t,R()*72); }
  for(let i=0;i<n*.15;i++){ const [px,py]=pt(); s+=leaf(px,py,h*(.12+R()*.1),R()*360,"leafD"); }
  if(opt.baby!==false) s+=dots(0,-h*.5,w*.8,h*.8,Math.round(fl*1.5),seed+99);
  return s+"</g>"; }
function stem(x1,y1,x2,y2,c,w){ return `<path d="M${f1(x1)} ${f1(y1)} Q${f1((x1+x2)/2+(y2-y1)*.15)} ${f1((y1+y2)/2)} ${f1(x2)} ${f1(y2)}" stroke="${c||"#6f8d55"}" stroke-width="${w||4}" fill="none" stroke-linecap="round"/>`; }
function tree(x,y,h,seed,opt){ opt=opt||{}; const R=rng(seed); const w=h*.62;
  let s=`<g transform="translate(${f1(x)} ${f1(y)})"><path d="M${f1(-h*.04)} 0 C${f1(-h*.03)} ${f1(-h*.25)} ${f1(-h*.07)} ${f1(-h*.45)} ${f1(-h*.02)} ${f1(-h*.6)} L${f1(h*.03)} ${f1(-h*.6)} C${f1(h*.02)} ${f1(-h*.4)} ${f1(h*.02)} ${f1(-h*.2)} ${f1(h*.05)} 0Z" fill="url(#trunk)"/>`;
  s+=`<path d="M${f1(-h*.01)} ${f1(-h*.45)} Q${f1(-h*.12)} ${f1(-h*.55)} ${f1(-h*.18)} ${f1(-h*.62)} M${f1(h*.01)} ${f1(-h*.5)} Q${f1(h*.1)} ${f1(-h*.58)} ${f1(h*.16)} ${f1(-h*.66)}" stroke="#7a5d48" stroke-width="${f1(h*.018)}" fill="none"/>`;
  for(let i=0;i<9;i++){ const a=R()*Math.PI*2, d=R()*.5; s+=bush(Math.cos(a)*d*w*.5, -h*.62+Math.sin(a)*d*h*.25 + h*.18, w*(.45+R()*.2), h*(.32+R()*.12), seed*13+i, {pal:opt.pal||"rose",flowers:opt.flowers==null?2:opt.flowers,baby:false}); }
  return s+"</g>"; }
function cypress(x,y,h,seed){ const R=rng(seed||((x+y)|0)); let s=`<g transform="translate(${f1(x)} ${f1(y)})"><path d="M0 ${f1(-h)} C${f1(h*.16)} ${f1(-h*.75)} ${f1(h*.15)} ${f1(-h*.2)} ${f1(h*.08)} 0 L${f1(-h*.08)} 0 C${f1(-h*.15)} ${f1(-h*.2)} ${f1(-h*.16)} ${f1(-h*.75)} 0 ${f1(-h)}Z" fill="url(#leafC)"/>`;
  for(let i=0;i<Math.round(h/7);i++){ const t=R(); const ww=Math.sin(Math.PI*Math.min(1,t*1.1))*h*.12; s+=leaf((R()-.5)*ww*1.6,-t*h,h*.07,(R()-.5)*120,R()>.5?"leafA":"leafC",.3); }
  return s+"</g>"; }
function urn(x,y,s,pal){ return `<g transform="translate(${f1(x)} ${f1(y)}) scale(${s})">${bush(0,-80,150,130,(x*3+y)|0,{pal:pal||"rose",flowers:5})}<path d="M-50 -86 H50 Q44 -62 30 -50 Q56 -30 36 -8 L22 0 H-22 L-36 -8 Q-56 -30 -30 -50 Q-44 -62 -50 -86Z" fill="url(#goldV)" stroke="#9b6c2c" stroke-opacity=".5" stroke-width="2"/><path d="M-38 -40 Q0 -28 38 -40" stroke="#fff3c9" stroke-width="3" fill="none" opacity=".7"/><rect x="-28" y="-6" width="56" height="12" rx="3" fill="#a77834"/></g>`; }
function grassEdge(y,seed,c1,c2){ const R=rng(seed); let s=""; for(let x=-20;x<1100;x+=9){ const h=14+R()*26; s+=`<path d="M${x} ${y} q${f1(R()*6-3)} ${f1(-h*.6)} ${f1(R()*8-4)} ${f1(-h)}" stroke="${R()>.5?c1:c2}" stroke-width="3" fill="none" stroke-linecap="round"/>`; } return s; }

/* ---------- architecture ---------- */
function archPath(x1,x2,yb,yt,lobes){ const cx=(x1+x2)/2, ys=yt+(x2-x1)*.42; const pts=[];
  const N=lobes||7; for(let i=0;i<=N;i++){ const t=i/N; let px,py; if(t<=.5){ const u=t*2; px=(1-u)*(1-u)*x1+2*(1-u)*u*x1+u*u*cx; py=(1-u)*(1-u)*ys+2*(1-u)*u*(yt+(ys-yt)*.15)+u*u*yt; } else { const u=(t-.5)*2; px=(1-u)*(1-u)*cx+2*(1-u)*u*x2+u*u*x2; py=(1-u)*(1-u)*yt+2*(1-u)*u*(yt+(ys-yt)*.15)+u*u*ys; } pts.push([px,py]); }
  let d=`M${f1(x1)} ${f1(yb)} L${f1(x1)} ${f1(ys)}`; for(let i=1;i<pts.length;i++){ const [ax,ay]=pts[i-1],[bx,by]=pts[i]; const L=Math.hypot(bx-ax,by-ay); d+=` A${f1(L*.58)} ${f1(L*.58)} 0 0 1 ${f1(bx)} ${f1(by)}`; }
  return d+` L${f1(x2)} ${f1(yb)}Z`; }
function chhatri(cx,by,w,c){ c=c||"url(#rosestone)"; const h=w*.9;
  return `<g><rect x="${f1(cx-w*.55)}" y="${f1(by-8)}" width="${f1(w*1.1)}" height="10" fill="#e6c0b0"/>
   ${[-.4,-.13,.13,.4].map(k=>`<rect x="${f1(cx+k*w-4)}" y="${f1(by-h*.5)}" width="8" height="${f1(h*.5)}" fill="#f6e2d8"/>`).join("")}
   <path d="M${f1(cx-w*.62)} ${f1(by-h*.48)} L${f1(cx+w*.62)} ${f1(by-h*.48)} L${f1(cx+w*.5)} ${f1(by-h*.58)} L${f1(cx-w*.5)} ${f1(by-h*.58)}Z" fill="#e8c6b6"/>
   <path d="M${f1(cx-w*.46)} ${f1(by-h*.58)} C${f1(cx-w*.56)} ${f1(by-h*1.05)} ${f1(cx-w*.18)} ${f1(by-h*1.25)} ${f1(cx)} ${f1(by-h*1.32)} C${f1(cx+w*.18)} ${f1(by-h*1.25)} ${f1(cx+w*.56)} ${f1(by-h*1.05)} ${f1(cx+w*.46)} ${f1(by-h*.58)}Z" fill="${c}" stroke="#c99c86" stroke-opacity=".5" stroke-width="2"/>
   <path d="M${f1(cx-w*.3)} ${f1(by-h*.7)} C${f1(cx-w*.32)} ${f1(by-h*1.0)} ${f1(cx-w*.12)} ${f1(by-h*1.16)} ${f1(cx)} ${f1(by-h*1.22)}" stroke="#fff" stroke-opacity=".5" stroke-width="${f1(w*.05)}" fill="none"/>
   <line x1="${f1(cx)}" y1="${f1(by-h*1.32)}" x2="${f1(cx)}" y2="${f1(by-h*1.55)}" stroke="#c49a4b" stroke-width="${f1(Math.max(2,w*.04))}"/><circle cx="${f1(cx)}" cy="${f1(by-h*1.44)}" r="${f1(w*.05)}" fill="url(#gold)"/></g>`; }
function crenel(x1,x2,y,size,c){ let s=""; for(let x=x1;x<x2-size*.5;x+=size*1.4) s+=`<path d="M${f1(x)} ${f1(y)} v${f1(-size*.6)} q${f1(size*.5)} ${f1(-size*.7)} ${f1(size)} 0 v${f1(size*.6)}z" fill="${c||"#f0d2c4"}"/>`; return s; }
function windowArch(x,y,w,h,glow){ return `<path d="${archPath(x,x+w,y+h,y,3)}" fill="#e7c3b2"/><path d="${archPath(x+5,x+w-5,y+h,y+6,3)}" fill="${glow?"#ffe2a6":"#a9b3cf"}"/>${glow?"":`<path d="${archPath(x+5,x+w-5,y+h,y+6,3)}" fill="url(#jaali)" opacity=".35"/>`}<rect x="${f1(x-4)}" y="${f1(y+h)}" width="${f1(w+8)}" height="6" fill="#e2bba8"/>`; }

/* ---------- small props ---------- */
function diyaSVG(x,y,s,lit){ return `<g transform="translate(${f1(x)} ${f1(y)}) scale(${s})">${lit?`<circle cx="0" cy="-30" r="80" fill="url(#glow)"/>`:""}
  <path d="M-52 -16 Q-50 22 0 24 Q50 22 52 -16 Q0 -2 -52 -16Z" fill="#c76b3d"/><path d="M-52 -16 Q0 -2 52 -16 Q0 -30 -52 -16Z" fill="#7c3420"/>
  <path d="M-46 -4 Q0 12 46 -4" stroke="#f1c66e" stroke-width="5" fill="none"/>${[-30,-15,0,15,30].map(k=>`<circle cx="${k}" cy="${f1(8-Math.abs(k)*.12)}" r="3.5" fill="#f1c66e"/>`).join("")}
  <path d="M40 -16 Q58 -26 60 -36 Q48 -26 30 -20Z" fill="#c76b3d"/>${lit?`<path d="M50 -40 C40 -60 52 -78 56 -92 C62 -76 72 -60 58 -40Z" fill="url(#flame)"/>`:`<path d="M54 -38 l2 -10" stroke="#5a3a20" stroke-width="3"/>`}</g>`; }
function flameSVG(x,y,s){ return `<g transform="translate(${f1(x)} ${f1(y)}) scale(${s})"><circle cx="0" cy="-10" r="70" fill="url(#glow)"/><path d="M0 0 C-14 -22 -2 -44 2 -62 C8 -44 22 -24 4 0Z" fill="url(#flame)"/><path d="M1 -4 C-4 -14 0 -26 2 -34 C6 -24 8 -14 3 -4Z" fill="#fffde8"/></g>`; }
function garlandRope(x1,x2,y,sag,pal,seed){ const R=rng(seed||5); let s=""; const n=Math.round((x2-x1)/20);
  for(let i=0;i<=n;i++){ const t=i/n, x=x1+(x2-x1)*t, yy=y+4*sag*t*(1-t); const k=pal[i%pal.length]; s+= (k==="or"||k==="yl")? marigold(x,yy,15,k,seed+i) : rose(x,yy,13,k,R()*360); if(i%3===1) s+=leaf(x,yy+12,34,180+(R()-.5)*60,"leafA"); }
  return s; }
function ladi(x,y,len,pal,seed,end){ /* hanging flower string */ const R=rng(seed); let s=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+len}" stroke="#7a5a3a" stroke-width="2"/>`;
  for(let yy=y+14; yy<y+len; yy+=24){ const k=pal[Math.floor(R()*pal.length)]; s+= (k==="or"||k==="yl")? marigold(x+(R()-.5)*3,yy,14,k,seed+yy) : k==="wh"? blossom(x,yy,13,"wh",R()*72) : rose(x,yy,12,k,R()*360); }
  const ty=y+len; s+= end==="bell"? `<path d="M${x-20} ${ty+38} Q${x-18} ${ty} ${x} ${ty} Q${x+18} ${ty} ${x+20} ${ty+38}Z" fill="url(#goldV)" stroke="#9b6c2c" stroke-opacity=".5"/><circle cx="${x}" cy="${ty+42}" r="7" fill="#9b6c2c"/>`

function garland(cx,cy,w,len,seed){ /* varmala: U-shaped rose & jasmine garland */ const R=rng(seed); let s=""; const n=26;
  for(let i=0;i<=n;i++){ const t=i/n, a=Math.PI*t; const x=cx-Math.cos(a)*w*.5, y=cy+Math.sin(a)*len; const k=i%3;
    s+= k===0? rose(x,y,15,"co",R()*360) : k===1? blossom(x,y,13,"wh",R()*72) : marigold(x,y,13,"yl",seed+i); }
  return s+`<path d="M${cx-8} ${cy+len} l-6 50 h28 l-6 -50z" fill="#c94a62"/>`; }

function layout(){ const W=innerWidth, H=innerHeight; const desk=W/H>.72&&W>700; stageEl.classList.toggle("is-desk",desk);

  const r=device.getBoundingClientRect(); DW=r.width; DH=r.height; S=DW/1080; OX=0; OY=(DH-1920*S)/2;
  document.querySelectorAll(".frame").forEach(f=>{ f.style.transform=`translate(0px,${OY-240*S}px) scale(${S})`; });
  fxC.width=DW*devicePixelRatio; fxC.height=DH*devicePixelRatio; fxC.style.width=DW+"px"; fxC.style.height=DH+"px"; }

function buildScene(def,k){ const el=document.createElement("section"); el.className="scene"; el.dataset.slug=def.slug; el.setAttribute("aria-label",def.label); el.setAttribute("aria-hidden","true");

  scenesEl.appendChild(el);
  const sc={def,el,k,L:{},layers:def.layers(),d2s:(x,y)=>({x:x*S+OX,y:y*S+OY})}; sc.hintEl=el.querySelector(".hint");
  const host=el.querySelector(".lays");
  sc.layers.forEach(ly=>{ const [x,y,w,h]=ly.box; const c=document.createElement(ly.src?"img":ly.div!=null?"div":"canvas"); c.className="lay"+(ly.cls?" "+ly.cls:""); ly.base=c.className;
    if(ly.src){ c.alt=""; c.draggable=false; c.decoding="async"; }

/* ---------- marigold shower: its own canvas over the scenes, so it never fights the fx paint ----------

async function playOpening(){ const c=$("#curtain"); if(opening||c.hidden) return; opening=true; await SC[0].ready;

  c.style.pointerEvents="none";
  c.querySelectorAll(".chipS,.ringS,.names").forEach(n=>anim(n,[{opacity:1},{opacity:0}],{duration:400}));

  c.hidden=true; opening=false; updateNav(); enter(SC[0]); }
function stepOpening(d){ const i=OPEN_ORDER.indexOf(OPEN_KEY); OPEN_KEY=OPEN_ORDER[(i+d+OPEN_ORDER.length)%OPEN_ORDER.length]; try{ localStorage.setItem("openKey",OPEN_KEY); }catch(e){} buildOpening(); }
function replayOpening(){ if(opening||state.busy||state.idx!==0) return; const c=$("#curtain"); resetScene(SC[0]); SC[0].el.classList.remove("reveal"); if(SC[0].hintEl) SC[0].hintEl.classList.remove("on");
  buildOpening(); c.hidden=false; c.style.pointerEvents=""; $("#oppick").hidden=false; updateNav(); if(OPEN_KEY==="envelope") requestAnimationFrame(layoutEnvelope); }
function buildCurtain(){ const c=$("#curtain"); buildOpening();
  c.addEventListener("click",()=>playOpening());
  c.addEventListener("keydown",e=>{ if(e.target.closest("#oppick")) return; if(e.key==="Enter"||e.key===" "){ e.preventDefault(); playOpening(); } });
  addEventListener("resize",()=>requestAnimationFrame(layoutEnvelope));
  setTimeout(()=>{ if(!state.opened) c.focus({preventScroll:true}); },300); }

/* ---------- music: generated tanpura drone + soft plucked pentatonic ---------- */
const MUSIC_SRC=null;
const MUSIC={ ctx:null, on:false, audio:null,
  start(){ if(this.ctx||this.audio) return this.resume();
    if(MUSIC_SRC){ this.audio=new Audio(MUSIC_SRC); this.audio.loop=true; this.audio.volume=.6; this.audio.play().catch(()=>{}); this.on=true; this.ui(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; const ctx=this.ctx=new AC();
    const master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination); master.gain.linearRampToValueAtTime(.55,ctx.currentTime+3);
    const conv=ctx.createConvolver(); const len=ctx.sampleRate*3.2, ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
    conv.buffer=ir; const wet=ctx.createGain(); wet.gain.value=.55; conv.connect(wet); wet.connect(master);
    const bus=ctx.createGain(); bus.connect(master); bus.connect(conv);
    [[146.83,.05],[110,.04],[73.42,.035]].forEach(([f,g])=>{ const o=ctx.createOscillator(), lp=ctx.createBiquadFilter(), gn=ctx.createGain(), lfo=ctx.createOscillator(), lg=ctx.createGain();
      o.type="sawtooth"; o.frequency.value=f; lp.type="lowpass"; lp.frequency.value=700; gn.gain.value=g; lfo.frequency.value=.13+Math.random()*.1; lg.gain.value=g*.4; lfo.connect(lg); lg.connect(gn.gain); o.connect(lp); lp.connect(gn); gn.connect(bus); o.start(); lfo.start(); });
    const scale=[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99,880], chords=[[293.66,369.99,440],[246.94,293.66,369.99],[196,246.94,293.66],[220,277.18,329.63]];
    let step=0, note=4; const beat=.56; let t=ctx.currentTime+.3;
    const pluck=(f,when,v)=>{ const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter(); o.type="triangle"; o2.type="sine"; o.frequency.value=f; o2.frequency.value=f*2; lp.type="lowpass"; lp.frequency.value=2600;
      g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(v,when+.008); g.gain.exponentialRampToValueAtTime(.0008,when+1.8); o.connect(g); o2.connect(g); g.connect(lp); lp.connect(bus); o.start(when); o2.start(when); o.stop(when+2); o2.stop(when+2); };
    const pad=(fs,when,dur)=>fs.forEach(f=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine"; o.frequency.value=f/2; g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(.05,when+1.2); g.gain.linearRampToValueAtTime(0,when+dur); o.connect(g); g.connect(bus); o.start(when); o.stop(when+dur+.1); });
    const sched=()=>{ while(t<ctx.currentTime+1.2){ if(step%8===0) pad(chords[(step/8)%4],t,beat*8.4);
        if(Math.random()<(step%2?.55:.9)){ note=Math.max(0,Math.min(scale.length-1,note+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)])); pluck(scale[note],t,.11+Math.random()*.05); if(step%8===0) pluck(scale[Math.max(0,note-3)]/2,t,.07); }
        t+=beat*(step%4===3?1.5:1)*.5; step++; } };
    sched(); setInterval(sched,250); this.on=true; this.ui();
    document.addEventListener("visibilitychange",()=>{ if(document.hidden) ctx.suspend(); else if(this.on) ctx.resume(); }); },
  resume(){ if(this.audio) this.audio.play().catch(()=>{}); else if(this.ctx) this.ctx.resume(); this.on=true; this.ui(); },
  toggle(){ if(!this.ctx&&!this.audio){ this.start(); return; } if(this.on){ if(this.audio) this.audio.pause(); else this.ctx.suspend(); this.on=false; } else this.resume(); this.ui(); },
  ui(){ const b=$("#nMute"); b.classList.toggle("muted",!this.on); b.setAttribute("aria-label",this.on?"Mute music":"Play music"); } };
